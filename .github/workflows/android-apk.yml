name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/115MediaHub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 115MediaHub-apk
          path: android/app/build/outputs/apk/debug/115MediaHub.apk
