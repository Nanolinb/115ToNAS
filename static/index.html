<body>

  <div class="logo"><svg class="logo-ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5c-.6 0-1 .4-1 1v12c0 .6.4 1 1 1h18c.6 0 1-.4 1-1V6c0-.6-.4-1-1-1H3zm1 13v-2h2v2H4zm0-4v-2h2v2H4zm0-4V8h2v2H4zm14 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4V8h2v2h-2zm2 8v-2h1v2h-1zm0-4v-2h1v2h-1zm0-4V8h1v2h-1zM4.5 3.2l15 2c.5.1.8.6.6 1l-.3.6H5.9l-1.7-2.3c-.2-.5-.3-1.2.3-1.3z"/></svg>115影库</div>

  <a class="tab" href="/admin" style="text-decoration:none"><svg class="gear-ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>管理</a>

<main>
  <section id="page-library">
    <div class="toolbar">
      <input type="search" id="libSearch" placeholder="搜索标题…">
      <select id="libType">
        <option value="">全部类型</option>
        <option value="movie">电影</option>
        <option value="show">剧集</option>
      </select>
      <select id="libGenre"><option value="">全部题材</option></select>
      <select id="libYear"><option value="0">全部年份</option></select>
    </div>
    <div class="grid" id="libGrid"></div>
    <div class="empty hidden" id="libEmpty">
      媒体库还是空的。<br><br>
      请管理他到 <a href="/admin" style="color:var(--accent2)">管理端</a> 登录 115 网盘并添加下载。
    </div>
  </section>
</main>

<!-- 观影密码登录（仅当管理端设置了观影密码时出现） -->
<div class="login-mask hidden" id="loginMask">
  <div class="login-box">
    <h1><svg class="logo-ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5c-.6 0-1 .4-1 1v12c0 .6.4 1 1 1h18c.6 0 1-.4 1-1V6c0-.6-.4-1-1-1H3zm1 13v-2h2v2H4zm0-4v-2h2v2H4zm0-4V8h2v2H4zm14 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4V8h2v2h-2zm2 8v-2h1v2h-1zm0-4v-2h1v2h-1zm0-4V8h1v2h-1zM4.5 3.2l15 2c.5.1.8.6.6 1l-.3.6H5.9l-1.7-2.3c-.2-.5-.3-1.2.3-1.3z"/></svg>115影库</h1>
    <p>输入观影密码</p>
    <input type="password" id="loginPw" placeholder="观影密码" autocomplete="current-password">
    <button class="btn primary" id="btnLogin">进入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask hidden" id="detailMask">
  <div class="modal" id="detailModal"></div>
</div>

<!-- 播放器弹窗 -->
<div class="modal-mask hidden" id="playerMask">
  <div class="modal player-modal">
    <video id="playerVideo" controls playsinline></video>
    <div id="seekBar" class="seek-bar hidden"><div class="seek-track"><div id="seekFill" class="seek-fill"></div></div><span id="seekTime" class="seek-time"></span></div>
    <div id="resumePrompt" class="hidden resume-prompt">
      <button class="resume-close" id="btnResumeClose" title="关闭">×</button>
      <span id="resumeText"></span>
      <button class="btn small primary" id="btnResumeYes">继续播放</button>
      <button class="btn small" id="btnResumeNo">从头开始</button>
    </div>
    <div class="player-bar">
      <span class="fname" id="playerName"></span>
      <select id="audioTrackSel" class="hidden track-sel" disabled></select>
      <button class="btn small hidden" id="btnIina">🍎 用 IINA 打开</button>
      <button class="btn small hidden" id="btnPlaylist">选集</button>
      <button class="btn small hidden" id="btnPrevEp">上一集</button>
      <button class="btn small hidden" id="btnNextEp">下一集</button>
      <button class="btn small" id="btnCopyLink">复制直链</button>
    </div>
    <div id="playerPlaylist" class="hidden playlist-panel"></div>
  </div>
</div>

<script src="/static/common.js?v=1.19.5"></script>
<script src="/static/viewer.js?v=1.19.5"></script>

</body>
</html>
