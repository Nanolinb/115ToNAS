plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.mediahub115.viewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mediahub115.viewer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
